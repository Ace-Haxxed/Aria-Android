name: Build APK

# The point of this workflow is that a phone can install ARIA without a
# development machine anywhere in the picture: every push to main leaves a
# downloadable APK, and every tag turns one into a Release you can open in the
# phone's browser and tap.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Sync the web build into the Android project
        run: npx cap sync android

      # Debug rather than release: a debug APK is signed with Android's own
      # debug keystore, so it installs by sideloading with nothing to configure.
      # An unsigned release APK will not install at all, and signing one needs a
      # keystore that must never live in a public repository.
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name it after the commit
        id: name
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$SRC" || { echo "no APK at $SRC"; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="aria-${{ github.ref_name }}.apk"
          else
            NAME="aria-$(git rev-parse --short HEAD).apk"
          fi
          cp "$SRC" "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: aria-apk
          path: ${{ steps.name.outputs.apk }}
          if-no-files-found: error

      # A tag is the "I want people to install this" signal. The Release page
      # is a plain URL a phone browser can open, which is the whole install
      # story — no store account, no site to host.
      - name: Publish the Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
          generate_release_notes: true
          body: |
            ## Install on Android

            1. Open this page **on the phone**.
            2. Tap `${{ steps.name.outputs.apk }}` below to download it.
            3. Open the download. Android will ask whether to allow installs
               from your browser — allow it, then confirm.

            This is a debug-signed build, which is what makes it installable
            without a Play Store account. Android will warn that it is from an
            unknown source; that is expected.

            Needs Android 8.0 or newer.
